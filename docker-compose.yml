services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mps}
      POSTGRES_USER: ${POSTGRES_USER:-mps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - mps_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mps} -d ${POSTGRES_DB:-mps}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-mps}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mps}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      MPS_JWT_SECRET: ${JWT_SECRET:-replace-with-at-least-32-characters}
      MPS_BOOTSTRAP_ENABLED: ${MPS_BOOTSTRAP_ENABLED:-true}
      MPS_BOOTSTRAP_ADMIN_EMAIL: ${MPS_BOOTSTRAP_ADMIN_EMAIL:-admin@mps.local}
      MPS_BOOTSTRAP_ADMIN_PASSWORD: ${MPS_BOOTSTRAP_ADMIN_PASSWORD:-ChangeThisPassword123!}
      MPS_DOCUMENTS_PATH: /app/data/documents
      MPS_BACKUPS_PATH: /app/data/backups
    ports:
      - "8080:8080"
    volumes:
      - mps_documents:/app/data/documents
      - mps_backups:/app/data/backups
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mps_postgres:
  mps_documents:
  mps_backups:
