name: MPS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test backend
        shell: bash
        run: |
          set +e
          mvn --batch-mode verify 2>&1 | tee /tmp/maven-build.log
          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then
            echo
            echo "========== IMPORTANT MAVEN ERRORS =========="
            grep -nE \
              "COMPILATION ERROR|Compilation failure|Tests run:|Failures:|Errors:|\[ERROR\].*\.java:\[" \
              /tmp/maven-build.log | head -80 || true
            echo "============================================="
            exit "$STATUS"
          fi

      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/**
            backend/target/site/jacoco/**
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

  containers:
    runs-on: ubuntu-latest
    needs:
      - backend
      - web

    steps:
      - uses: actions/checkout@v4

      - name: Validate production compose file
        run: docker compose -f docker-compose.prod.yml config

      - name: Build backend image
        run: docker build -t mps-backend:ci backend

      - name: Build web image
        run: docker build -t mps-web:ci web

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: mps-backend:ci
          format: table
          exit-code: "1"
          severity: CRITICAL
