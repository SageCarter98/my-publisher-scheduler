name: Bootstrap MPS source

on:
  push:
    paths:
      - my-publisher-scheduler-v1.0.0-rc2.zip
      - .github/workflows/bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm archive exists
        run: |
          test -f my-publisher-scheduler-v1.0.0-rc2.zip
          echo "Release archive found."

      - name: Validate archive paths
        run: |
          python3 - <<'PY'
          from pathlib import PurePosixPath
          from zipfile import ZipFile

          archive = "my-publisher-scheduler-v1.0.0-rc2.zip"

          with ZipFile(archive) as package:
              for name in package.namelist():
                  path = PurePosixPath(name)

                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe archive path: {name}")

          print("Archive paths are safe.")
          PY

      - name: Extract release archive
        run: |
          rm -rf /tmp/mps-unpack
          mkdir -p /tmp/mps-unpack

          unzip -q my-publisher-scheduler-v1.0.0-rc2.zip \
            -d /tmp/mps-unpack

      - name: Validate extracted project
        run: |
          RELEASE_DIR="/tmp/mps-unpack/mps_v1_release"

          test -d "$RELEASE_DIR"
          test -f "$RELEASE_DIR/backend/pom.xml"
          test -f "$RELEASE_DIR/web/package.json"
          test -f "$RELEASE_DIR/README.md"
          test -f "$RELEASE_DIR/VERSION"

          echo "Extracted project structure is valid."

      - name: Remove workflow files from imported package
        run: |
          RELEASE_DIR="/tmp/mps-unpack/mps_v1_release"

          rm -rf "$RELEASE_DIR/.github"

          echo "Packaged workflow files excluded from import."

      - name: Copy project into repository
        run: |
          RELEASE_DIR="/tmp/mps-unpack/mps_v1_release"

          cp -a "$RELEASE_DIR/." .

          echo "Project source copied into repository."

      - name: Verify imported source
        run: |
          test -f backend/pom.xml
          test -f web/package.json
          test -d mobile
          test -d infra
          test -d docs
          test -d ops

          echo "MPS source import verified."

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            README.md \
            VERSION \
            backend \
            web \
            mobile \
            infra \
            docs \
            ops \
            docker-compose.yml \
            docker-compose.prod.yml \
            .env.example \
            .env.production.example \
            .gitignore \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No new source changes to commit."
            exit 0
          fi

          git commit -m "Import MPS 1.0.0-rc2 source"
          git push origin HEAD:main
