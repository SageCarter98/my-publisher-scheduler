name: Bootstrap MPS source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm archive exists
        run: |
          test -f my-publisher-scheduler-v1.0.0-rc2.zip
          echo "Release archive found."

      - name: Validate archive paths
        run: |
          python3 - <<'PY'
          from pathlib import PurePosixPath
          from zipfile import ZipFile

          archive = "my-publisher-scheduler-v1.0.0-rc2.zip"

          with ZipFile(archive) as package:
              for name in package.namelist():
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe archive path: {name}")

          print("Archive paths are safe.")
          PY

      - name: Extract release archive
        run: |
          rm -rf /tmp/mps-unpack
          mkdir -p /tmp/mps-unpack
          unzip -q my-publisher-scheduler-v1.0.0-rc2.zip \
            -d /tmp/mps-unpack

      - name: Validate extracted project
        run: |
          RELEASE_DIR="/tmp/mps-unpack/mps_v1_release"

          test -f "$RELEASE_DIR/backend/pom.xml"
          test -f "$RELEASE_DIR/web/package.json"
          test -f "$RELEASE_DIR/README.md"
          test -f "$RELEASE_DIR/VERSION"

          echo "Extracted project structure is valid."

      - name: Exclude packaged GitHub workflows
        run: |
          rm -rf /tmp/mps-unpack/mps_v1_release/.github

      - name: Copy project into repository
        run: |
          cp -a /tmp/mps-unpack/mps_v1_release/. .

      - name: Verify imported source
        run: |
          test -f backend/pom.xml
          test -f web/package.json
          test -d mobile
          test -d infra
          test -d docs
          test -d ops

          echo "MPS source import verified."

      - name: Stage imported files
        run: |
          git add -A -- \
            . \
            ':(exclude).github/**' \
            ':(exclude)my-publisher-scheduler-v1.0.0-rc2.zip'

          echo "Staged files:"
          git diff --cached --name-only

          test -n "$(git diff --cached --name-only)"

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Import MPS 1.0.0-rc2 source"
          git push origin HEAD:main
